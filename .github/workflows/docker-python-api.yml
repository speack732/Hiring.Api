


name: Build and Deploy Python API

on:
  push:
    branches:
      - main-python

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/neta-hiring-python-api
  IMAGE_TAG: main-python
  PROJECT_PATH: neta-hiring-poc/python-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set build metadata
        run: |
          echo "BUILD_DATE_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "GIT_COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "GIT_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
          --build-arg DOCKER_IMAGE_BUILD_DATE_UTC=$BUILD_DATE_UTC \
          --build-arg GIT_COMMIT_SHA=$GIT_COMMIT_SHA \
          --build-arg GIT_BRANCH=$GIT_BRANCH \
          -t $IMAGE_NAME:$IMAGE_TAG \
          $PROJECT_PATH

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Trigger Portainer webhook
        run: |
          curl -X POST "${{ secrets.PORTAINER_PYTHON_WEBHOOK_URL }}"